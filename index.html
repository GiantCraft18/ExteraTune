<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ExteraTune | Сайт</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a12;color:#c8c8e8;font-family:'JetBrains Mono',monospace;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;background-image:radial-gradient(circle at 20% 30%,rgba(255,0,150,.08)0%,transparent 50%),radial-gradient(circle at 80% 70%,rgba(100,0,255,.06)0%,transparent 50%)}
        body::before,body::after{content:'';position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(60px);opacity:.3;animation:float 12s ease-in-out infinite alternate}
        body::before{width:300px;height:300px;background:#ff007a;top:-100px;left:-100px}
        body::after{width:400px;height:400px;background:#7a00ff;bottom:-150px;right:-150px;animation-delay:4s}
        @keyframes float{0%{transform:translate(0,0)scale(1);opacity:.2}50%{transform:translate(50px,30px)scale(1.2);opacity:.4}100%{transform:translate(-30px,-20px)scale(.8);opacity:.2}}
        .container{max-width:600px;width:100%;background:rgba(18,18,28,.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.06);border-radius:28px;padding:30px 25px 25px;box-shadow:0 20px 60px rgba(0,0,0,.6);position:relative;z-index:1;animation:in .8s cubic-bezier(.16,1,.3,1)}
        @keyframes in{0%{opacity:0;transform:translateY(30px)scale(.96)}100%{opacity:1;transform:translateY(0)scale(1)}}
        .divider{height:1px;background:linear-gradient(to right,transparent,rgba(255,255,255,.08),transparent);margin:16px 0;position:relative;overflow:hidden}
        .divider::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(to right,transparent,#ff7eb3,transparent);opacity:.3;animation:shimmer 3s infinite}
        @keyframes shimmer{0%{left:-100%}100%{left:100%}}
        .nav-bar{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:20px;padding:6px;background:rgba(255,255,255,.02);border-radius:16px;border:1px solid rgba(255,255,255,.06)}
        .nav-bar a{color:#8888aa;text-decoration:none;font-size:13px;padding:6px 14px;border-radius:30px;transition:.2s;font-weight:500;letter-spacing:.3px}
        .nav-bar a:hover{color:#fff;background:rgba(255,255,255,.06)}
        .nav-bar a.active{color:#ff7eb3;background:rgba(255,100,200,.08);border:1px solid rgba(255,100,200,.15)}
        .nav-bar a.blog-link{color:#ff7eb3;border:1px solid rgba(255,100,200,.1)}
        .nav-bar a.blog-link:hover{background:rgba(255,100,200,.12);border-color:rgba(255,100,200,.3)}
        .avatar{width:120px;height:120px;border-radius:50%;margin:0 auto 16px;overflow:hidden;border:2px solid rgba(255,255,255,.08);box-shadow:0 0 40px rgba(255,100,200,.05);background:linear-gradient(135deg,#ff00a0,#7a00ff);padding:3px}
        .avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #0a0a12;transition:transform .4s}
        .avatar:hover img{transform:scale(1.05)}
        .username{text-align:center;font-size:24px;font-weight:700;background:linear-gradient(135deg,#ff7eb3,#7a00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:inline-block;width:100%}
        .sub{text-align:center;color:#8888aa;font-size:14px;margin-top:4px}
        .sub span{background:rgba(255,255,255,.04);padding:2px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.06);display:inline-block;transition:.3s}
        .sub span:hover{border-color:#ff7eb3;background:rgba(255,255,255,.06)}
        .links-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:16px 0}
        .links-grid a{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);padding:10px 8px;border-radius:12px;text-align:center;color:#9999bb;text-decoration:none;font-size:13px;transition:.3s;position:relative;overflow:hidden}
        .links-grid a::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(135deg,#ff7eb3,#7a00ff);opacity:.06;transition:left .5s}
        .links-grid a:hover::before{left:0}
        .links-grid a:hover{background:rgba(255,255,255,.06);color:#fff;border-color:#ff7eb3;transform:translateY(-2px)scale(1.02);box-shadow:0 8px 25px rgba(255,0,150,.05)}
        .player-wrapper{background:rgba(255,255,255,.02);border-radius:16px;padding:16px 15px;margin:16px 0;border:1px solid rgba(255,255,255,.06)}
        .player-wrapper iframe{width:100%;border-radius:12px;border:none;height:400px}
        .player-container{min-height:80px;display:flex;align-items:center;justify-content:center}
        .player-container .placeholder{color:#555577;font-size:13px;text-align:center}
        .player-container .placeholder .icon{font-size:28px;display:block;margin-bottom:6px}
        .player-container .placeholder a{color:#ff7eb3;text-decoration:underline}
        .footer-tag{text-align:center;color:#333355;font-size:13px;margin-top:20px;letter-spacing:1px;transition:.3s}
        .footer-tag:hover{color:#8888aa}
        .footer-tag span{color:#444466;opacity:.6;transition:.3s}
        .footer-tag:hover span{opacity:1;text-shadow:0 0 30px rgba(255,0,150,.1)}
        @media(max-width:500px){.container{padding:20px 15px}.nav-bar a{font-size:11px;padding:4px 10px}.links-grid{grid-template-columns:repeat(auto-fit,minmax(80px,1fr))}.links-grid a{font-size:11px;padding:8px 4px}.avatar{width:90px;height:90px}.username{font-size:20px}.player-wrapper iframe{height:280px}}
        @media(max-width:380px){.container{padding:15px 10px}.username{font-size:17px}.links-grid a{font-size:10px;padding:6px 3px}.avatar{width:70px;height:70px}.player-wrapper iframe{height:200px}}
    </style>
</head>
<body>
<div class="container">

    <!-- ===== НАВИГАЦИЯ ===== -->
    <div class="nav-bar">
        <a href="index.html" class="active">🏠 Главная</a>
        <a href="about.html">👤 Обо мне</a>
        <a href="tech.html">⚡ Тех Стек</a>
        <a href="projects.html">📦 Проекты</a>
        <a href="blog.html" class="blog-link">📝 Блог</a>
    </div>

    <div class="divider"></div>

    <!-- ===== АВАТАР ===== -->
    <div class="avatar"><img src="https://avatars.mds.yandex.net/i?id=af33e631e93213bdb137b542a3c9cf7d_l-5318046-images-thumbs&n=13" alt="avatar"></div>
    <div class="username">ExteraTune</div>
    <div class="sub"><span>@brilliant_boss</span></div>

    <div class="divider"></div>

    <!-- ===== СОЦСЕТИ ===== -->
    <div class="links-grid">
        <a href="https://t.me/ExteraTune" target="_blank">📱 Telegram</a>
        <a href="https://discord.gg/ваш_сервер" target="_blank">💬 Discord</a>
        <a href="https://github.com/giantcraft18" target="_blank">🐙 GitHub</a>
        <a href="https://tiktok.com/@ваш_ник" target="_blank">🎵 TikTok</a>
        <a href="blog.html" target="_blank">📝 Блог</a>
        <a href="https://matrix.to/#/@ваш_ник:matrix.org" target="_blank">🔗 Matrix</a>
        <a href="https://steamcommunity.com/id/ваш_ник" target="_blank">🎮 Steam</a>
    </div>

    <!-- ===== ПЛЕЕР (ОДИН ТРЕК) ===== -->
    <div class="player-wrapper">
        <div id="p" class="player-container">
            <iframe src="https://music.yandex.ru/iframe/#track/153681603/43077708/" 
                    width="100%" 
                    height="400" 
                    frameborder="0" 
                    allowfullscreen 
                    style="border-radius:12px;height:400px;">
            </iframe>
        </div>
    </div>

    <!-- ===== ФУТЕР ===== -->
    <div class="footer-tag">&gt; <span>ExteraTune</span> &lt;</div>

</div>

<script>
    // Если плеер не загрузился — показываем ссылку
    setTimeout(() => {
        const iframe = document.querySelector('.player-wrapper iframe');
        if (iframe) {
            iframe.onerror = function() {
                document.getElementById('p').innerHTML = `
                    <div class="placeholder">
                        <span class="icon">🎵</span>
                        Плеер недоступен<br>
                        <a href="https://music.yandex.ru/album/43077708/track/153681603" 
                           target="_blank" 
                           style="color: #ff7eb3; text-decoration: underline; margin-top: 6px; display: inline-block;">
                           Открыть трек →
                        </a>
                    </div>
                `;
            };
        }
    }, 5000);
</script>

</body>
</html>
