name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]  # Автоматически при пуше в main
  workflow_dispatch:    # Также можно запустить вручную

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Send Telegram notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            STATUS="✅ УСПЕШНО"
            EMOJI="🚀"
            MESSAGE="Сайт успешно обновлён!"
          else
            STATUS="❌ ОШИБКА"
            EMOJI="🔥"
            MESSAGE="При деплое произошла ошибка."
          fi

          TEXT="$EMOJI Деплой ExteraTune: $STATUS

$MESSAGE

🌐 Ссылка: ${{ steps.deployment.outputs.page_url }}

📦 Репозиторий: ${{ github.repository }}
📅 Дата: $(date '+%d.%m.%Y %H:%M')"

          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="$TEXT" \
          -d parse_mode="Markdown"